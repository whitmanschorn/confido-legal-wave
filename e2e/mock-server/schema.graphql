"""
Indicates exactly one field must be supplied and this field must not be `null`.
"""
directive @oneOf on INPUT_OBJECT

"\n(FROZEN) Defines a single bank account for the corresponding Firm.\n"
type BankAccount implements Node {
  """A unique uuidv4 value for this object."""
  id: ID!
  accountHolderName: String!
  accountType: String!

  "\nThe category of the bank account. Either 'operating' or 'trust'.\n"
  category: String!
  disbursementSettings: BankAccountDisbursementSettings!
  firmId: String!

  """Indicates if the BankAccount is used for chargebacks for the firm."""
  isChargebackAccount: Boolean!

  """Indicates if the BankAccount is the default for it's category."""
  isDefault: Boolean!

  """Indicates if the BankAccount is used for billing the firm."""
  isFeeAccount: Boolean!

  "\nThe last four digits of the bank account. Example: '1234'.\n"
  lastFour: String

  "\nThe nickname of this bank account normally set by the Firm.\n"
  nickname: String!
  routingNumber: String!
}

interface Node {
  id: ID!
}

type BankAccountDisbursementSettings {
  allowDisbursements: Boolean!
  ACH: DisbursementMethodAchSettings!
  PAYPAL: DisbursementMethodSettings!
  PUSH_TO_CARD: DisbursementMethodSettings!
  REQUEST_CHECK: DisbursementMethodSettings!
  ZELLE: DisbursementMethodSettings!
}

type DisbursementMethodAchSettings {
  active: Boolean!
  defaulted: Boolean!
  enabled: Boolean!
  verified: Boolean! @deprecated(reason: "Prefer the active field instead")
  verifyStatus: DisbursementMethodAchVerifyStatus! @deprecated(reason: "This field is no longer used")
}

enum DisbursementMethodAchVerifyStatus {
  DEPOSIT_ONLY
  PENDING
  VERIFIED
}

type DisbursementMethodSettings {
  active: Boolean!
  defaulted: Boolean!
  enabled: Boolean!
  verified: Boolean! @deprecated(reason: "Prefer the active field instead")
}

type FirmSettings implements Node {
  id: ID!
  achEnabled: Boolean!
  achProcessor: AchProcessor! @deprecated(reason: "Use processingEnv instead")
  approvedForAch: Boolean!
  approvedForCard: Boolean!
  approvedForSurcharge: Boolean!

  """
  A url to the Confido Legal UI branding page for customizing the payment page.
  """
  brandingPageUrl: String!
  ccProcessor: CreditCardProcessor! @deprecated(reason: "Use processingEnv instead")
  checkEnabled: Boolean!
  checkMailingAddress: Address @deprecated(reason: "Use firm.settings.mailingAddress instead.")
  combineInvoicesForSameClient: Boolean!
  creditEnabled: Boolean!
  debitEnabled: Boolean!
  mailingAddress: Address
  processingEnv: ProcessingEnv!
  promptToCreateSPM: Boolean!
  requireCvvForSpm: Boolean!
  surchargeEnabled: Boolean!
  surchargeRate: Float
  timezone: String!
  usePaymentPage2: Boolean!
  businessAddress: Address!
}

enum AchProcessor {
  adyen
  emergepay
  emergepay_sandbox
  epmock
  vericheck
  vcmock
}

enum CreditCardProcessor {
  adyen
  emergepay
  emergepay_sandbox
  epmock
}

"\n(FROZEN) An Address is in various entities (Client, Contact, etc.) to define where\nthe entity is located.\n"
type Address {
  """A unique uuidv4 value for this object."""
  id: ID

  "\n(Nullable) The city for this Address.\n"
  city: String

  "\n(Nullable) The country for this Address. Defaults to US.\n"
  country: String

  "\n(Nullable) The first line for this Address.\n"
  line1: String

  "\n(Nullable) The second line for this Address.\n"
  line2: String

  "\n(Nullable) The state for this Address.\n"
  state: String

  "\n(Nullable) The zip code for this Address.\n"
  zip: String
}

enum ProcessingEnv {
  production
  sandbox
}

"\nA Stored Payment Method is a payment method (credit card, ACH, etc.) that has been saved to be charged\nlater in the future. A Stored Payment Method is created by first creating a URL for a specific Client.\nThe URL is then given to the Client for the payment method (credit card, ACH, etc.) info to be input.\nAfter the Client saves their payment info at the URL, it can be found by querying the Client again with\nthe storedPaymentMethods included in the request.\n"
type StoredPaymentMethod implements Node {
  """A unique uuidv4 value for this object."""
  id: ID!

  """
  The balance associated with this Stored Payment Method object. All values in Cents.
  """
  balance: Balance!
  canReactivate: Boolean!

  "\nThe brand of the stored payment method card if the paymentMethod is credit or debit.\nExample: 'mastercard' or 'visa'.\n"
  cardBrand: String

  "\nThe Client associated with this Stored Payment Method. If null, Firm will be defined.\n"
  client: Client
  declineInfo: SpmDeclineInfo

  "\nThe Firm associated with this Stored Payment Method. If null, Client will be defined.\n"
  firm: Firm

  "\nThe last four digits (this will sometimes return three) of the card number or ach bank account. Example: '1234'.\n"
  lastFour: String

  "\nThe name the user input on the Stored Payment Method creation page.\n"
  payerName: String

  "\nA nickname for this specific Stored Payment Method. This should be set after the user has created the\nStored Payment Method and is used to help organize Stored Payment Methods if a single client has\nmultiple.\n"
  nickname: String

  "\nThe payment method of this Stored Payment Method. Example: 'ACH' or 'CREDIT'.\n"
  paymentMethod: String!
  status: String!
  sessions: [SavePaymentMethodSession!]!
  surcharging: StoredPaymentMethodSurcharging!
  type: String!
}

"\n(FROZEN) Defines payment metrics for an entity. Used to look at the historical and current\nstate for a specific entity (Client, Matter, etc.). A balance will always be\nattached to another entity and describes the data of that parent entity.\n"
type Balance {
  "\nThe total outstanding amount in cents for all operating Bank Accounts for the parent entity.\n"
  operatingOutstanding: Int!

  "\nThe total amount paid in cents to all operating Bank Accounts for the parent entity.\n"
  operatingPaid: Int!

  "\nThe total outstanding amount in cents for all Bank Accounts for the parent entity.\n"
  totalOutstanding: Int!

  "\nThe total amount paid in cents for all Bank Accounts for the parent entity.\n"
  totalPaid: Int!

  "\nThe total outstanding amount in cents for all trust Bank Accounts for the parent entity.\n"
  trustOutstanding: Int!

  "\nThe total amount paid in cents for all Bank Accounts for the parent entity.\n"
  trustPaid: Int!
}

type SpmDeclineInfo {
  consecutiveDeclines: Int!
  declineMessage: String!
}

type SavePaymentMethodSession {
  errorMessage: String
  status: String!
  token: String!
}

type StoredPaymentMethodSurcharging {
  rate: Float
  willBeApplied: Boolean!
}

type Payment implements Node {
  id: ID!
  amount: Int!
  cardBrand: String
  client: Client
  createdOn: DateTimeISO!
  firm: Firm!
  latestActivity: DateTimeISO!
  matter: Matter
  paymentLink: PaymentLink
  status: PaymentStatus!
  storedPaymentMethod: StoredPaymentMethod
  transactions: [Transaction!]!
}

"""
A date-time string at UTC, such as 2007-12-03T10:15:30Z, compliant with the `date-time` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.This scalar is serialized to a string in ISO 8601 format and parsed from a string in ISO 8601 format.
"""
scalar DateTimeISO

enum PaymentStatus {
  error
  success
  partial_success
  failed
}

"\n(FROZEN) Defines the amount object used commonly when referring to charging a specific Bank Account.\n"
type Amount implements Node {
  """A unique uuidv4 value for this object."""
  id: ID!

  "\nInteger value in cents.\n"
  amount: Int!

  "\nA uuidv4 id for the Bank Account to associate the amount with.\n"
  bankAccount: BankAccount!
}

"\nDefines a PaymentLink for a specific Client. This is the most common payment\nvehicle used.\n"
type PaymentLink implements Node {
  """A unique uuidv4 value for this object."""
  id: ID!
  aggregatePaymentLinks(
    """
    The cursor to start the query from. The response will not include the object associated with the cursor.
    """
    after: String

    """The number of objects to return after the cursor."""
    first: Int = 10

    """
    The order direction the objects should be returned in. Either ASC for ascending or DESC for descending.
    """
    orderDirection: String = "ASC"
  ): AggregatePaymentLinkConnection!

  "\nA list of the amounts currently associated with this PaymentLink. These\nrepresent the amount that will be charged and the bank account the money will\ngo into.\n"
  amounts: [Amount!]!

  """
  The balance associated with this PaymentLink object. All values in Cents.
  """
  balance: Balance!

  "\nThe Client charges to this PaymentLink will be recorded under.\n"
  client: Client!
  clio: PaymentLinkClio

  """A Date object representing when this PaymentLink was created."""
  createdOn: DateTimeISO!

  """
  (Nullable) An externalId for integration partners to set and query with.
  """
  externalId: ID

  "\nThe Firm this PaymentLink is associated with. This Firm must also have the\nbank accounts under the amounts associated with it.\n"
  firm: Firm!

  "\n(Optional) A matter to also associate payments to this PaymentLink with.\n"
  matter: Matter

  "\n(Optional) A memo associated with the PaymentLink.\n"
  memo: String

  "\n(Optional) Override for whether this PaymentLink allows partial payments. If\n'null', the Firm-level paylink partial payment setting is used.\n"
  partialPaymentAllowed: Boolean

  "\nThe effective partial payment setting for this PaymentLink and whether the\nFirm-level paylink partial payment setting was used.\n"
  partialPayment: PaymentLinkPartialPayment!

  "\nA list of the amounts currently associated with this PaymentLink. These\nrepresent the amount that will be charged and the bank account the money will\ngo into.\n"
  paymentMethodsAllowed: [PaymentMethod!]!

  "\nA connection of all Payments made on this PaymentLink.\n"
  payments(
    """
    The cursor to start the query from. The response will not include the object associated with the cursor.
    """
    after: String

    """The number of objects to return after the cursor."""
    first: Int = 10

    """
    The order direction the objects should be returned in. Either ASC for ascending or DESC for descending.
    """
    orderDirection: String = "ASC"
  ): PaymentConnection!
  qbDocNumber: String
  qbEnabled: Boolean
  qbInvoiceRef: String
  qbRealmId: String

  "\nIf 'false', Confido Legal will not send any receipts out for this Payment Link.\nThis defaults to 'true' so by default, Confido Legal will send out all receipts\nfor the Payment Link.\n"
  sendReceipts: Boolean!

  "\nThe current status of this PaymentLink. Options: 'unpaid' | 'partially_paid' |\n'paid' | 'sealed'\n"
  status: String!

  "\nIndicates whether or not surcharge will be applied to credit cards for payments\non this link.\n"
  surchargeEnabled: Boolean!

  "\nA connection of all Transactions made on this PaymentLink.\n"
  transactions(
    """The createdOn date to grab Transaction objects after."""
    createdAfter: String

    """
    The cursor to start the query from. The response will not include the object associated with the cursor.
    """
    after: String

    """The number of objects to return after the cursor."""
    first: Int = 10

    """
    The order direction the objects should be returned in. Either ASC for ascending or DESC for descending.
    """
    orderDirection: String = "ASC"
  ): TransactionConnection!

  "\nThe external url to the payment page for this PaymentLink.\n"
  url: String!
}

type AggregatePaymentLinkConnection {
  edges: [AggregatePaymentLinkEdge!]!
  pageInfo: PageInfo!
}

type AggregatePaymentLinkEdge {
