  "(Optional) \nAn object defining the schedule of the subscription. When the subscription charges the\nclient and when the subscription is considered fulfilled.\n"
  schedule: UpdateScheduleInput

  "\n(Optional) The id of a stored payment method to set on the subscription. If this is\nprovided, the status of the subscription will be 'active' immediately.\n\nIf this is omitted, the subscription url that is returned should be used\nto collect the payment method from a firm's client.\n"
  storedPaymentMethodId: String

  "\n(Optional) The amount in cents to charge the client on each billing cycle. The amount\nwill be deposited into the firm's default trust account.\n\nIf this field is provided, amounts and operating must be omitted.\n"
  trust: Int
}

input UpdateScheduleInput {
  "(Optional) \nAn object that defines when the subscription ends. This object should contain one (and\nonly one) of the following keys: 'amountPaid', 'never', 'on', or 'payments'.\n\nWhen the subscription ends is updated, the original termination type can not be changed.\nFor example, if the subscription ends was 'amountPaid', you can not update the ends to\n'never' or 'on'.\n"
  ends: SubscriptionEndsInput

  "(Optional) \nThe frequency of the subscription. This object should contain one (and only one) of the\nfollowing keys: 'biweekly', 'monthly', 'weekly', or 'yearly'.\n"
  frequency: SubscriptionFrequencyInput
