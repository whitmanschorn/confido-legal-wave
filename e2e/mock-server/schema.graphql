type Subscription {
  "\nA list of one amount object indicating the amount that will be charged and\nthe bank account to which the amount will be deposited on each billing cycle.\n"
  amounts: [Amount!]!

  "\nA Balance object with the current state of the subscription.\n"
  balance: Balance!

  "\nThe Client associated with the subscription.\n"
  client: Client!

  """A unique uuidv4 value for this object."""
  id: String!

  "\n(Nullable) The Matter associated with the subscription.\n"
  matter: Matter

  "\nThe payment methods to allow when activating or updating the subscription.\n"
  paymentMethods: [PaymentMethod!]

  "\nAn object defining the schedule of the subscription. When the subscription charges the\nclient and when the subscription is considered fulfilled.\n"
  schedule: Schedule!

  "\nThe current status of the subscription.\n\nPossible values: 'active', 'canceled', 'fulfilled', 'payment_failed',\n'needs_attention', and 'pending'\n"
  status: String!

  "\n(Nullable) The stored payment method associated with the subscription.\n\nIf this is null, the url should be used to activate the subscription by collecting\nthe client of the firm's payment method information.\n"
  storedPaymentMethod: StoredPaymentMethod

  "\nA boolean value indicating whether surcharging will be added to the subscription\npayments.\n"
  surchargeEnabled: Boolean!

  "\nA list of upcoming payment dates. This will be a list of string values of the\nform 'YYYY-MM-DD'.\n"
  upcomingPayments: [UpcomingPayment!]!

  "\nThe url to use to activate or change the stored payment method of the subscription\nby collecting the firm's client's payment method information.\n"
  url: String!
}

type Schedule {
  ends: SubscriptionEnds!
