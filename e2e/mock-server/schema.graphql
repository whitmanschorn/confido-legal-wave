"\nDefines a Matter for a specific Client. Useful for grouping Payments together\nunder a specific name.\n"
type Matter implements Node {
  """A unique uuidv4 value for this object."""
  id: ID!

  "\nBalance object holding all the historic payment information for this matter in cents.\n"
  balance: Balance!

  "\nThe primary Client associated with this Matter.\n"
  client: Client!

  """
  (Nullable) An externalId for integration partners to set and query with.
  """
  externalId: ID

  "\n(Nullable) A Date object representing the latest activity on this Matter.\n"
  latestActivity: DateTimeISO
  metadata: JSON

  "\nA name given to this Matter.\n"
  name: String!

  "\nA Connection of all the Payment Links associated with this Matter.\n"
  paymentLinks(
    """The createdOn date to grab Payment Link objects after."""
    afterDate: String

    """
    The cursor to start the query from. The response will not include the object associated with the cursor.
    """
    after: String

    """The number of objects to return after the cursor."""
    first: Int = 10

    """
    The order direction the objects should be returned in. Either ASC for ascending or DESC for descending.
    """
    orderDirection: String = "ASC"
  ): PaymentLinkConnection!

  "\nA Connection of all the Payments made on this Matter.\n"
  payments(
    """The createdOn date to grab Payment objects after."""
    afterDate: String

    """
    The cursor to start the query from. The response will not include the object associated with the cursor.
    """
    after: String

    """The number of objects to return after the cursor."""
    first: Int = 10

    """
    The order direction the objects should be returned in. Either ASC for ascending or DESC for descending.
    """
    orderDirection: String = "ASC"
  ): PaymentConnection!

  "\n(Nullable) A secondary Client associated with this Matter.\n"
  secondaryClient: Client

  "\n(Nullable) The original source of the Matter. If null, it was created through the Confido Legal UI.\n"
  source: String

  "\nThe current status of this Matter.\n"
  status: String!
  subscriptions(
    """
    The cursor to start the query from. The response will not include the object associated with the cursor.
    """
    after: String

    """The number of objects to return after the cursor."""
    first: Int = 10

    """
    The order direction the objects should be returned in. Either ASC for ascending or DESC for descending.
    """
    orderDirection: String = "ASC"
  ): SubscriptionConnection!

  "\nA Connection of all the Transactions associated with this Matter. You can also\nspecify a timestamp on afterDate to gather all Transactions after that\ntimestamp.\n"
  transactions(
    """The createdOn date to grab Transaction objects after."""
    afterDate: String

    """
    The cursor to start the query from. The response will not include the object associated with the cursor.
    """
    after: String

    """The number of objects to return after the cursor."""
    first: Int = 10

    """
    The order direction the objects should be returned in. Either ASC for ascending or DESC for descending.
    """
    orderDirection: String = "ASC"
  ): TransactionConnection!
}

"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).
